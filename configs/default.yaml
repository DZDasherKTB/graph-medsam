project_name: "Graph-MedSAM-Vessel"

model:
  embedding_dim: 768
  num_supervoxels: 125        # 5×5×5 spatial anchors
  encoder_frozen_layers: 8
  medsam_checkpoint: "weights/medsam_vit_b.pth"

graph:
  sigma_f: 1.0
  sigma_s: 1.0
  lambda_f: 1.0
  lambda_s: 0.5

loss_weights:
  dice: 1.0
  boundary: 0.5
  geometry: 0.1
  topology: 0.2

training:
  batch_size: 2
  epochs: 100
  lr_graph: 1e-4
  lr_encoder: 1e-5
  lr_decoder: 1e-4
  weight_decay: 1e-2
  num_workers: 4

dataset:
  train_images: []
  train_masks: []

  val_images: []
  val_masks: []

  patch_size: [128, 128, 128]
  input_channels: 1